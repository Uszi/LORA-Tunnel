[platformio]
default_envs = heltec-v4-r8-tft
; Isolate pinned packages from other projects replacing shared Arduino versions.
core_dir = .pio-core

[env:heltec-v4-r8-tft]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = heltec_v4_r8_tft
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.embed_files =
  assets/lora-tunnel-radio-logo.png
  assets/vts-official-logo.png
monitor_speed = 115200
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  lovyan03/LovyanGFX@1.2.24
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@2.5.2
  jgromes/RadioLib@7.8.1
  rweather/Crypto@0.4.0

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++14
test_build_src = no
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:cardputer-adv-lora1262]
extra_scripts =
  pre:tools/cardputer_build.py
  post:tools/cardputer_linker_pio.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = cardputer_adv_lora1262
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_build.embed_files =
  assets/lora-tunnel-radio-logo.png
  assets/vts-official-logo.png
monitor_speed = 115200
build_flags =
  -D LORA_TUNNEL_CARDPUTER_ADV=1
  -include include/cardputer_nimble_config.h
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5GFX@0.2.36
  m5stack/M5Unified@0.2.29
  z3t0/IRremote@4.5.0
  https://github.com/m5stack/M5Cardputer.git#2d4fa6646e4e5b47e0af96214b003aa7b15b8d81
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@2.5.2
  jgromes/RadioLib@7.8.1
  rweather/Crypto@0.4.0
lib_ignore = LovyanGFX
