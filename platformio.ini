[platformio]
default_envs = heltec-v4-r8-tft
; Isolate pinned packages from other projects replacing shared Arduino versions.
core_dir = .pio-core

[env:heltec-v4-r8-tft]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = heltec_v4_r8_tft
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.embed_files = assets/lora-tunnel-radio-logo.png
monitor_speed = 115200
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  lovyan03/LovyanGFX@1.2.24
  mikalhart/TinyGPSPlus@1.1.0
  bblanchon/ArduinoJson@6.21.5
  h2zero/NimBLE-Arduino@2.5.2
  jgromes/RadioLib@7.8.1

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags = -std=c++14
test_build_src = no
lib_deps = bblanchon/ArduinoJson@6.21.5
