name: Build and host checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-and-parsers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned build frontend
        run: python -m pip install platformio==6.2.0 -r tools/site-requirements.txt -r tools/test-requirements.txt
      - name: Validate schemas and shipped examples
        run: python tools/check_schemas.py
      - name: Exporter and serial helper unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Installer control checks without a browser or device
        run: node --test tests/test_web_app.cjs
      - name: Native parser and state tests
        run: python -m platformio test -e native
      - name: Actual uploader lifecycle with offline transport and SD fixtures
        run: python tools/check_uploader.py
      - name: Capture queue capacity and lossless record memory
        run: python tools/check_capture_memory.py
      - name: Actual LoRa profile switching with offline radio fixtures
        run: python tools/check_lora_hopping.py
      - name: Configuration scratch lifetime and allocation failures
        run: python tools/check_config_memory.py
      - name: Complete logger evidence within the Cardputer JSON arena
        run: python tools/check_logger_capacity.py
      - name: Compile the exact V4-R8 Expansion V2 target
        run: python -m platformio run -e heltec-v4-r8-tft
      - name: Compile Cardputer ADV with Cap LoRa-1262
        run: python -m platformio run -e cardputer-adv-lora1262
      - name: Independent encrypted and signed mesh packet fixtures
        run: python tools/check_mesh_crypto.py
      - name: Cardputer linker policy and real pinned SDK drift checks
        run: python -m unittest discover -s tests -p test_cardputer_linker.py -v
      - name: Cardputer keyboard mapping against pinned upstream headers
        run: python tools/check_cardputer_keyboard.py
      - name: Validate Cardputer factory and Launcher application
        run: python tools/package_cardputer.py --build .pio/build/cardputer-adv-lora1262 --check-only
      - name: Check public source package inventory
        run: python tools/package_source.py dist/source-check.zip

# CI checks source/build behavior. It cannot certify a GPS fix, radio reception,
# SD integrity, button behavior, a browser flash, or a drive on physical hardware.
